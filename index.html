<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>تسجيل الدخول</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: url('syria.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .login {
      position: relative;
      width: 340px;
      padding: 30px;
      border-radius: 20px;
      z-index: 1;
      overflow: hidden;
    }

    .login::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(#00ffff, #ff00ff, #00ffff);
      animation: rotate 6s linear infinite;
      z-index: -2;
    }

    .login:hover::after {
      content: "";
      position: absolute;
      inset: 4px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 15px;
      border: 4px solid #ff0055;
      z-index: -1;
      transition: 0.3s;
    }

    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .login-box {
      position: relative;
      background: rgba(45, 45, 57, 0.95);
      border-radius: 15px;
      padding: 25px;
      z-index: 1;
    }

    .login-box h2 {
      text-align: center;
      color: #fff;
      margin-bottom: 20px;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 30px;
      border: none;
      font-size: 15px;
      outline: none;
      text-align: right;
    }

    .login-box input::placeholder {
      text-align: right;
      color: #aaa;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #00e5ff;
      border: none;
      border-radius: 30px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .login-box .links {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 13px;
      color: #fff;
    }

    .login-box .links a {
      color: #ff0055;
      text-decoration: none;
    }

    .video-container {
      margin-top: 20px;
      border-radius: 10px;
      overflow: hidden;
    }

    .video-container video {
      width: 100%;
      border-radius: 10px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="login">
    <div class="login-box">
      <h2>🔊 تسجيل الدخول ❤️</h2>
      <input type="text" id="username" placeholder="اسم المستخدم">
      <input type="password" id="password" placeholder="كلمة المرور">
      <button onclick="login()">دخول</button>
      <div class="links">
        <a href="#">نسيت كلمة المرور؟</a>
        <a href="#">إنشاء حساب</a>
      </div>

      <div class="video-container">
        <video id="loginVideo" loop playsinline autoplay muted>
          <source src="videoo.mp4" type="video/mp4">
          المتصفح لا يدعم الفيديو.
        </video>
      </div>
    </div>
  </div>

  <script>
    function login() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;

      if (u === 'arduino' && p === '31') {
        alert("تم تسجيل الدخول بنجاح");
        window.location.href = "esad.html";
      } else {
        alert("اسم المستخدم أو كلمة المرور غير صحيحة");
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      const video = document.getElementById("loginVideo");
      video.muted = true;
      video.volume = 1;

      const playPromise = video.play();

      if (playPromise !== undefined) {
        playPromise.catch(() => {
          document.body.addEventListener("click", () => {
            video.muted = false;
            video.play();
          }, { once: true });
        });
      } else {
        
        video.muted = false;
      }
    });
  </script>

</body>
</html>
