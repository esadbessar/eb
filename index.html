<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
    }
    .box {
      position: relative;
      width: 320px;
      padding: 30px;
      border-radius: 20px;
      overflow: hidden;
      z-index: 1;
    }
    .box::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #00fff7, #ff00c8);
      filter: blur(20px);
      animation: rotate 5s linear infinite;
      z-index: -2;
    }
    .box::after {
      content: "";
      position: absolute;
      inset: 5px;
      background: #1c1c24;
      border-radius: 15px;
      border: 1px solid #2a2a38;
      z-index: -1;
    }
    .box:hover::after {
      border-color: #ff0080;
      box-shadow: 0 0 15px #ff00cc;
      transition: 0.3s;
    }
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .box h2 {
      color: #fff;
      text-align: center;
      margin-bottom: 20px;
    }
    .box input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 25px;
      font-size: 14px;
      outline: none;
      text-align: right;
      background: #fff;
    }
    .box button {
      width: 100%;
      padding: 12px;
      background: #00e5ff;
      color: #000;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      margin-top: 10px;
      cursor: pointer;
      font-weight: bold;
    }
    .links {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-top: 10px;
    }
    .links a {
      color: #ff0055;
      text-decoration: none;
    }
    .video-container {
      margin-top: 20px;
      border-radius: 12px;
      overflow: hidden;
    }
    .video-container video {
      width: 100%;
      border-radius: 12px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>❤️ تسجيل الدخول 🔊</h2>
    <input type="text" id="username" placeholder="اسم المستخدم">
    <input type="password" id="password" placeholder="كلمة المرور">
    <button onclick="login()">دخول</button>
    <div class="links">
      <a href="#">نسيت كلمة المرور؟</a>
      <a href="#">إنشاء حساب</a>
    </div>
    <div class="video-container">
      <video id="loginVideo" autoplay loop playsinline>
        <source src="videoo.mp4" type="video/mp4">
        لا يدعم متصفحك الفيديو.
      </video>
    </div>
  </div>

  <script>
    function login() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      if (u === 'arduino' && p === '31') {
        alert("تم تسجيل الدخول");
        window.location.href = 'esad.html';
      } else {
        alert("بيانات خاطئة");
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      const video = document.getElementById("loginVideo");
      video.play().catch(() => { /* ignore */ });

      document.body.addEventListener("click", function openSound() {
        video.muted = false;
        document.body.removeEventListener("click", openSound);
      });
    });
  </script>

</body>
</html>
