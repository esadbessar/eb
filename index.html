<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-image: URL(syria.jpg);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
    }
    .box {
      position: relative;
      width: 320px;
      padding: 30px;
      border-radius: 20px;
      overflow: hidden;
      z-index: 1;
    }
    .box::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #00fff7, #ff00c8);
      filter: blur(20px);
      animation: rotate 5s linear infinite;
      z-index: -2;
    }
    .box:hover::before {
      animation: rotate 5s linear infinite, flash 0.5s infinite alternate;
    }

    .box::after {
      content: "";
      position: absolute;
      inset: 5px;
      background: #1c1c24;
      border-radius: 15px;
      border: 1px solid #2a2a38;
      z-index: -1;
    }
    .box:hover::after {
      border-color: #ff0080;
      box-shadow: 0 0 15px #ff00cc;
      transition: 0.3s;
    }
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes flash {
      from { opacity: 1; }
      to { opacity: 0.5; }
    }

    .box h2 {
      color: #fff;
      text-align: center;
      margin-bottom: 20px;
    }
    .box input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 25px;
      font-size: 14px;
      outline: none;
      text-align: right;
      background: #fff;
    }
    .box button {
      width: 100%;
      padding: 12px;
      background: #00e5ff;
      color: #000;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      margin-top: 10px;
      cursor: pointer;
      font-weight: bold;
    }
    .links {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-top: 10px;
    }
    .links a {
      color: #ff0055;
      text-decoration: none;
    }
    .video-container {
      margin-top: 20px;
      border-radius: 12px;
      overflow: hidden;
      display: none; /* Başlangıçta gizli */
    }
    .video-container video {
      width: 100%;
      border-radius: 12px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="box" onmouseover="showVideo()" onmouseout="hideVideo()">
    <h2>❤️ تسجيل الدخول 🔊</h2>
    <input type="text" id="username" placeholder="اسم المستخدم">
    <input type="password" id="password" placeholder="كلمة المرور">
    <button onclick="login()">دخول</button>
    <div class="video-container" id="videoContainer">
      <video id="loginVideo" loop playsinline muted> <source src="videoo.mp4" type="video/mp4">
        Tarayıcınız video desteklemiyor.
      </video>
    </div>
  </div>
    <button class="box" onclick="window.location.href='https://esadbessar.github.io/arduinostore'" style="width: 320px; margin-bottom:20px; color:blue;">
      ARDUINO STORE
    </button>
</div>
  <script>
    let videoElement = null;
    let videoContainerElement = null;
    let hasUserInteracted = false;

    document.addEventListener('DOMContentLoaded', (event) => {
        videoElement = document.getElementById('loginVideo');
        videoContainerElement = document.getElementById('videoContainer');

        if (videoElement) {
            videoElement.muted = true;
            videoElement.volume = 0;
            videoElement.pause(); 
            videoElement.currentTime = 0;
        }


        document.addEventListener('click', function enableVideoSoundHandler() {
            if (videoElement && videoElement.muted) { 
                videoElement.muted = false; 
                videoElement.volume = 1;
                hasUserInteracted = true; 
          
                document.removeEventListener('click', enableVideoSoundHandler);
            }
        });
    });

    function login() {
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');

      if (usernameInput.value === 'arduino' && passwordInput.value === '31') {
        alert("👌🖕🫦🫦");
        window.location.href = 'esad.html';
      } else {
        alert("yarragı yedin");
        window.location.href = 'boom.html';
      }
    }


    function showVideo() {
      if (!videoElement || !videoContainerElement) return;


      videoContainerElement.style.display = 'block';
      
      videoElement.muted = true; 
      videoElement.volume = 0;
      videoElement.currentTime = 0; 
      videoElement.play().catch(error => {
        console.warn("Video play error (likely autoplay restrictions):", error);

      });

    
      if (hasUserInteracted) {
          videoElement.muted = false;
          videoElement.volume = 1;
      }
    }

    function hideVideo() {
      if (!videoElement || !videoContainerElement) return;

      videoElement.pause();
      videoContainerElement.style.display = 'none'; 
      videoElement.currentTime = 0; 
      videoElement.muted = true;
    }
  </script>

</body>
</html>
