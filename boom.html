<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hata! Tank Yönlendirildi!!!!</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            min-height: 100vh;
            background-color: #000; 
            color: #fff;
            font-family: sans-serif;
            text-align: center;
            padding: 20px; 
            box-sizing: border-box; 
        }

        .hero-text {
            font-size: 10vw; 
            background-color: red;
            color: white;
            font-weight: bold;
            width: 100%;
            padding: 20px 0;
            box-sizing: border-box; 
            margin-bottom: 20px; 
        }

  
        @media (max-width: 600px) {
            .hero-text {
                font-size: 12vw; 
            }
        }

        .video-container {
            width: 90%; 
            max-width: 800px; 
            border-radius: 10px; 
            overflow: hidden;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.7); 

        video {
            width: 100%; 
            height: auto; 
            display: block; 
        }
    </style>
</head>
<body>
    <div class="hero-text">الله أكبر دبابة تتحرك نحو الوطن !!!</div>
    <div class="video-container">
        <video id="tankVideo" src="tank.mp4" autoplay loop muted playsinline>
            Tarayıcınız video desteklemiyor.
        </video>
    </div>

    <script>
        document.addEventListener('click', function enableVideoSound() {
            const video = document.getElementById('tankVideo');
          
            if (video && video.muted) {
                video.muted = false; 
                video.volume = 1;    
                
                document.removeEventListener('click', enableVideoSound);
            }
        });
    </script>
</body>
</html>
