<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Doğum Günü Kutlaması</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 20px 10px;
      background: linear-gradient(to right, #ffecd2, #fcb69f);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      flex-direction: column;
      overflow-x: hidden; /* Prevent horizontal scroll */
    }

    .gift-box {
      width: 150px;
      height: 150px;
      background-color: #d63384;
      position: relative;
      cursor: pointer;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      flex-shrink: 0;
    }

    .gift-box::before,
    .gift-box::after {
      content: "";
      position: absolute;
      background-color: #fff;
    }

    .gift-box::before {
      width: 20px;
      height: 100%;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
    }

    .gift-box::after {
      height: 20px;
      width: 100%;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
    }

    .gift-lid {
      width: 170px;
      height: 40px;
      background-color: #c2185b;
      position: absolute;
      top: -40px;
      left: -10px;
      border-radius: 10px 10px 0 0;
      box-shadow: 0 5px 10px rgba(0,0,0,0.1);
    }

    .gift-container {
      position: relative;
      margin-bottom: 20px;
      /* Added for centering the gift on smaller screens */
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .message {
      display: none;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 1s forwards;
      width: 90%; /* Adjusted for better mobile fit */
      max-width: 400px; /* Slightly increased max-width for overall content */
      padding: 0 10px; /* Add some padding for spacing */
    }

    .message h1 {
      color: #6a1b9a;
      font-size: 24px; /* Increased font size for better readability */
      margin-top: 20px;
      text-align: center;
      word-break: break-word; /* Ensure long text breaks */
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(50px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .carousel {
      width: 100%;
      max-width: 360px; /* Keep consistent with design, but let parent flex adjust */
    }

    .carousel-item img {
      width: 100%;
      border-radius: 10px;
      height: auto;
      object-fit: cover;
    }

    audio {
      margin-top: 20px;
      width: 100%;
      max-width: 360px;
    }

    /* Mobil uyumlu */
    @media (max-width: 768px) { /* Changed breakpoint to include tablets */
      .gift-box {
        width: 130px; /* Slightly larger gift box for better tap target */
        height: 130px;
      }
      .gift-lid {
        width: 150px; /* Adjust lid size relative to box */
        height: 35px;
        top: -35px;
        left: -10px;
      }
      .message h1 {
        font-size: 20px; /* Adjust message font size for smaller screens */
      }
      .carousel {
        max-width: 100%; /* Allow carousel to take full width of its container */
      }
    }

    @media (max-width: 400px) { /* Specific adjustments for very small phones */
      .gift-box {
        width: 110px; /* Smaller gift box for very narrow screens */
        height: 110px;
      }
      .gift-lid {
        width: 130px;
        height: 30px;
        top: -30px;
        left: -10px;
      }
      .message {
        width: 95%; /* Make message slightly wider on very small screens */
        padding: 0 5px;
      }
      .message h1 {
        font-size: 18px; /* Further adjust font size */
      }
      audio {
        width: 95%; /* Adjust audio player width */
      }
    }

  </style>
</head>
<body>

  <div class="gift-container" onclick="openGift()">
    <div class="gift-lid"></div>
    <div class="gift-box"></div>
  </div>

  <div class="message" id="message">
    <div id="birthdayCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active" data-bs-interval="2000">
          <img src="8.jpg" class="d-block w-100" alt="Foto 1">
        </div>
        <div class="carousel-item" data-bs-interval="2000">
          <img src="18.jpg" class="d-block w-100" alt="Foto 2">
        </div>
        <div class="carousel-item" data-bs-interval="2000">
          <img src="19.jpg" class="d-block w-100" alt="Foto 3">
        </div>
        <div class="carousel-item" data-bs-interval="2000">
          <img src="20.jpg" class="d-block w-100" alt="Foto 4">
        </div>
        <div class="carousel-item" data-bs-interval="2000">
          <img src="39.jpg" class="d-block w-100" alt="Foto 5">
        </div>
        <div class="carousel-item" data-bs-interval="2000">
          <img src="16.jpg" class="d-block w-100" alt="Foto 6">
        </div>
      </div>

      <button class="carousel-control-prev" type="button" data-bs-target="#birthdayCarousel" data-bs-slide="prev" style="width:40px; height:40px;">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Önceki</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#birthdayCarousel" data-bs-slide="next" style="width:40px; height:40px;">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Sonraki</span>
      </button>
    </div>

    <h1>Doğum günün kutlu olsun Ertuğrul 🎉</h1>

    <audio id="bgMusic" loop>
      <source src="music.mp3" type="audio/mpeg">
    </audio>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function openGift() {
      document.querySelector('.gift-container').style.display = 'none';
      const msg = document.getElementById('message');
      msg.style.display = 'flex';

      const music = document.getElementById('bgMusic');
      music.volume = 1.0;
      music.play();
    }
  </script>
</body>
</html>
