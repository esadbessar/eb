<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Doğum Günü Kutlaması</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #ffecd2, #fcb69f);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      flex-direction: column;
    }

    .gift-box {
      width: 150px;
      height: 150px;
      background-color: #d63384;
      position: relative;
      cursor: pointer;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .gift-box::before,
    .gift-box::after {
      content: "";
      position: absolute;
      background-color: #fff;
    }

    .gift-box::before {
      width: 20px;
      height: 100%;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
    }

    .gift-box::after {
      height: 20px;
      width: 100%;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
    }

    .gift-lid {
      width: 170px;
      height: 40px;
      background-color: #c2185b;
      position: absolute;
      top: -40px;
      left: -10px;
      border-radius: 10px 10px 0 0;
      box-shadow: 0 5px 10px rgba(0,0,0,0.1);
    }

    .gift-container {
      position: relative;
    }

    .message {
      display: none;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 1s forwards;
    }

    .message h1 {
      color: #6a1b9a;
      font-size: 22px;
      margin-top: 20px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(50px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .carousel {
      width: 300px;
    }

    .carousel-item img {
      width: 100%;
      border-radius: 10px;
    }

    audio {
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- Hediye Kutusu -->
  <div class="gift-container" onclick="openGift()">
    <div class="gift-lid"></div>
    <div class="gift-box"></div>
  </div>

  <!-- Mesaj ve Carousel -->
  <div class="message" id="message">
    <div id="birthdayCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active" data-bs-interval="2000">
          <img src="8.jpg" class="d-block w-100" alt="Foto 1">
        </div>
        <div class="carousel-item" data-bs-interval="2000">
          <img src="18.jpg" class="d-block w-100" alt="Foto 2">
        </div>
        <div class="carousel-item" data-bs-interval="2000">
          <img src="19.jpg" class="d-block w-100" alt="Foto 3">
        </div>
        <div class="carousel-item" data-bs-interval="2000">
          <img src="20.jpg" class="d-block w-100" alt="Foto 4">
        </div>
        <div class="carousel-item" data-bs-interval="2000">
          <img src="39.jpg" class="d-block w-100" alt="Foto 5">
        </div>
        <div class="carousel-item" data-bs-interval="2000">
          <img src="16.jpg" class="d-block w-100" alt="Foto 6">
        </div>
      </div>

      <!-- Navigasyon -->
      <button class="carousel-control-prev" type="button" data-bs-target="#birthdayCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#birthdayCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
      </button>
    </div>

    <h1>Doğum günün kutlu olsun Ertuğrul 🎉</h1>

    <audio id="bgMusic" loop>
      <source src="music.mp3" type="audio/mpeg">
    </audio>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function openGift() {
      document.querySelector('.gift-container').style.display = 'none';
      const msg = document.getElementById('message');
      msg.style.display = 'flex';

      const music = document.getElementById('bgMusic');
      music.volume = 1.0;
      music.play();
    }
  </script>
</body>
</html>
