<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تسجيل الدخول</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: #111;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      direction: rtl;
    }

    .box {
      position: relative;
      width: 320px;
      padding: 40px 30px;
      border-radius: 20px;
      z-index: 1;
      color: white;
    }

    .box::before {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      background: linear-gradient(45deg, #0ff, #f0f, #0ff);
      filter: drop-shadow(0 15px 50px #000);
      border-radius: 20px;
      animation: rotate 4s linear infinite;
      z-index: -2;
    }

    .box::after {
      content: "";
      position: absolute;
      inset: 4px;
      background: #2d2d39;
      border-radius: 15px;
      border: 8px solid #25252b;
      z-index: -1;
    }

    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .box h2 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 24px;
      letter-spacing: 2px;
    }

    .box input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 2px solid #444;
      border-radius: 30px;
      background: transparent;
      color: white;
      font-size: 14px;
      outline: none;
      text-align: right;
    }

    .box input::placeholder {
      color: #aaa;
    }

    .box button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 30px;
      background: #00e5ff;
      color: black;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .box button:hover {
      background: #00bcd4;
    }

    .box .links {
      margin-top: 15px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
    }

    .box .links a {
      color: #ff0055;
      text-decoration: none;
      transition: 0.3s;
    }

    .box .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>🔊 تسجيل الدخول ❤️</h2>
    <input type="text" placeholder="اسم المستخدم" id="username">
    <input type="password" placeholder="كلمة المرور" id="password">
    <button onclick="login()">دخول</button>
    <div class="links">
      <a href="#">نسيت كلمة المرور؟</a>
      <a href="#">إنشاء حساب</a>
    </div>
  </div>

  <script>
    function login() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;

      if (u === 'arduino' && p === '31') {
        alert("تم تسجيل الدخول بنجاح");
        window.location.href = "esad.html";
      } else {
        alert("اسم المستخدم أو كلمة المرور غير صحيحة");
      }
    }
  </script>
</body>
</html>
