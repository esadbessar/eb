<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
    }
    .box {
      position: relative;
      width: 320px;
      padding: 30px;
      border-radius: 20px;
      overflow: hidden;
      z-index: 1;
    }
    .box::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #00fff7, #ff00c8);
      filter: blur(20px);
      animation: rotate 5s linear infinite;
      z-index: -2;
    }
    /* Yanıp sönme efekti için ::before üzerine hover (önceki gibi) */
    .box:hover::before {
      animation: rotate 5s linear infinite, flash 0.5s infinite alternate; /* Hem dönme hem yanıp sönme */
    }

    .box::after {
      content: "";
      position: absolute;
      inset: 5px;
      background: #1c1c24;
      border-radius: 15px;
      border: 1px solid #2a2a38;
      z-index: -1;
    }
    .box:hover::after {
      border-color: #ff0080;
      box-shadow: 0 0 15px #ff00cc;
      transition: 0.3s;
    }
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    /* Yanıp sönme animasyonu */
    @keyframes flash {
      from { opacity: 1; }
      to { opacity: 0.5; } /* Hafifçe şeffaf yaparak yanıp sönme hissi verir */
    }

    .box h2 {
      color: #fff;
      text-align: center;
      margin-bottom: 20px;
    }
    .box input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 25px;
      font-size: 14px;
      outline: none;
      text-align: right;
      background: #fff;
    }
    .box button {
      width: 100%;
      padding: 12px;
      background: #00e5ff;
      color: #000;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      margin-top: 10px;
      cursor: pointer;
      font-weight: bold;
    }
    .links {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-top: 10px;
    }
    .links a {
      color: #ff0055;
      text-decoration: none;
    }
    .video-container {
      margin-top: 20px;
      border-radius: 12px;
      overflow: hidden;
      /* Başlangıçta gizli tut */
      display: none;
    }
    .video-container video {
      width: 100%;
      border-radius: 12px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="box" onmouseover="showVideo()" onmouseout="hideVideo()">
    <h2>❤️ تسجيل الدخول 🔊</h2>
    <input type="text" id="username" placeholder="اسم المستخدم">
    <input type="password" id="password" placeholder="كلمة المرور">
    <button onclick="login()">دخول</button>
    <div class="links">
      <a href="#">نسيت كلمة المرور؟</a>
      <a href="#">إنشاء حساب</a>
    </div>
    <div class="video-container" id="videoContainer">
      <video id="loginVideo" loop playsinline muted> <source src="videoo.mp4" type="video/mp4">
        Tarayıcınız video desteklemiyor.
      </video>
    </div>
  </div>

  <script>
    let isVideoPlaying = false; // Video oynatılıp oynatılmadığını takip etmek için

    function login() {
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');

      if (usernameInput.value === 'arduino' && passwordInput.value === '31') {
        alert("تم تسجيل الدخول");
        window.location.href = 'esad.html';
      } else {
        alert("بيانات خاطئة");
      }
    }

    // Fare kutunun üzerine geldiğinde videoyu göster ve sessiz oynat
    function showVideo() {
      const videoContainer = document.getElementById('videoContainer');
      const video = document.getElementById('loginVideo');

      if (!isVideoPlaying) { // Video zaten oynamıyorsa
        videoContainer.style.display = 'block'; // Video kapsayıcısını görünür yapar
        video.muted = true; // Video sessiz başlar
        video.volume = 0; // Ses seviyesini sıfır yapar
        video.play().then(() => {
          isVideoPlaying = true; // Video başarıyla oynatılmaya başlandı
        }).catch(error => {
          console.error("Video oynatma hatası:", error);
          // Kullanıcı etkileşimi olmadan oynatılamazsa hata yakalama
          console.log("Tarayıcı, kullanıcı etkileşimi olmadan videoyu otomatik oynatmayı engelledi.");
          // Video oynatılamazsa konteyneri gizleyebiliriz
          videoContainer.style.display = 'none';
        });
      }
    }

    // Fare kutudan çıktığında videoyu durdur ve gizle
    function hideVideo() {
      const videoContainer = document.getElementById('videoContainer');
      const video = document.getElementById('loginVideo');

      if (isVideoPlaying) { // Video oynatılıyorsa
        video.pause(); // Videoyu durdur
        videoContainer.style.display = 'none'; // Videoyu gizle
        video.currentTime = 0; // Videoyu başa sar
        video.muted = true; // Tekrar sessize al
        isVideoPlaying = false; // Video artık oynamıyor
      }
    }

    // Kullanıcı herhangi bir yere tıkladığında videonun sesini aç
    document.addEventListener('click', function enableVideoSound() {
      const video = document.getElementById('loginVideo');
      if (video && video.muted && isVideoPlaying) { // Video sessizdeyse ve oynuyorsa
        video.muted = false; // Sesi aç
        video.volume = 1; // Ses seviyesini tam yap
        // Bu event listener'ı bir kez çalıştıktan sonra kaldırabiliriz
        document.removeEventListener('click', enableVideoSound);
      }
    });

    // Sayfa yüklendiğinde videonun başlangıç ayarlarını yap
    window.addEventListener('DOMContentLoaded', (event) => {
        const video = document.getElementById('loginVideo');
        if (video) {
            video.muted = true; // Sayfa yüklenince video sessiz olsun
            video.volume = 0;
            video.pause(); // Başlangıçta duraklatılmış olsun
            video.currentTime = 0;
        }
    });
  </script>

</body>
</html>
