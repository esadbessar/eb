<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>موقع خطير</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: url('syria.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: Arial, sans-serif;
    }

    .login {
      position: relative;
      width: 320px;
      margin: 100px auto;
      padding: 20px;
      box-sizing: border-box;
      z-index: 1;
    }

    .login::before {
      content: "";
      position: absolute;
      top: -15px;
      left: -15px;
      width: calc(100% + 30px);
      height: calc(100% + 30px);
      background: conic-gradient(#00f, #f0f, #0ff, #00f);
      border-radius: 30px;
      filter: blur(10px);
      animation: rotating 6s linear infinite;
      z-index: -2;
    }

    .login::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(45, 45, 57, 0.95);
      border-radius: 20px;
      border: 4px solid #25252b;
      z-index: -1;
    }

    @keyframes rotating {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .login h2 {
      color: white;
      text-align: center;
      margin-bottom: 20px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    .error {
      color: red;
      text-align: center;
      margin-top: 10px;
    }

    .video-container {
      margin-top: 20px;
      border-radius: 10px;
      overflow: hidden;
    }

    .video-container video {
      width: 100%;
      height: auto;
      border-radius: 10px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="login">
    <h2>تسجيل الدخول</h2>
    <form onsubmit="login(); return false;">
      <input type="text" id="username" placeholder="اسم المستخدم" />
      <input type="password" id="password" placeholder="كلمة المرور" />
      <button type="submit">مدخل</button>
      <div class="error" id="errorMsg"></div>
    </form>

    <div class="video-container">
      <video id="loginVideo" loop playsinline muted autoplay>
        <source src="videoo.mp4" type="video/mp4">
        Tarayıcınız video etiketini desteklemiyor.
      </video>
    </div>
  </div>

  <script>
    function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      if (username === 'arduino' && password === '31') {
        window.location.href = 'esad.html';
      } else {
        errorMsg.textContent = "اسم المستخدم وكلمة المرور غير صحيحين!";
      }
    }

    // Video sesi açmak için kullanıcı etkileşimini bekle
    window.addEventListener("DOMContentLoaded", () => {
      const video = document.getElementById("loginVideo");
      video.muted = true;
      video.volume = 1;

      const playPromise = video.play();

      if (playPromise !== undefined) {
        playPromise.catch(() => {
          document.body.addEventListener("click", () => {
            video.muted = false;
            video.volume = 1;
            video.play();
          }, { once: true });
        });
      }
    });
  </script>
</body>
</html>
